<!doctype html>
<html lang="id">

<meta charset="utf-8" />

<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--surface-page); font-family: var(--font-sans); color: var(--text-primary); }
  a { color: inherit; }

  /* Responsive rules for the landing kit */
  @media (max-width: 1000px) {
    .dps-cat-grid { grid-template-columns: repeat(3, 1fr) !important; }
    .dps-prod-grid, .dps-benefit-grid, .dps-testi-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .dps-step-grid { grid-template-columns: repeat(2, 1fr) !important; row-gap: 36px !important; }
    .dps-trust-grid { grid-template-columns: repeat(3, 1fr) !important; row-gap: 18px !important; }
    .dps-footer-grid { grid-template-columns: 1fr 1fr !important; }
  }
  @media (max-width: 760px) {
    .dps-hero-grid { grid-template-columns: 1fr !important; }
    .dps-hero-visual { display: none !important; }
    .dps-nav-links, .dps-nav-cta { display: none !important; }
    .dps-nav-burger { display: flex !important; }
    .dps-cat-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .dps-prod-grid, .dps-benefit-grid, .dps-testi-grid { grid-template-columns: 1fr !important; }
    .dps-step-grid { grid-template-columns: 1fr !important; }
    .dps-step-line { display: none !important; }
    .dps-trust-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .dps-footer-grid { grid-template-columns: 1fr !important; }
  }
</style>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 22px 24px; }
  .row { display: flex; gap: 14px; }
  .g { flex: 1; height: 78px; border-radius: 14px; display: flex; align-items: flex-end; padding: 12px 14px; font-size: 12px; font-weight: 700; }
</style>
</head>
<body>
  <div class="row">
    <div class="g" style="background: var(--gradient-brand); color:#fff">--gradient-brand</div>
    <div class="g" style="background: var(--gradient-mint); color:#06321f">--gradient-mint</div>
    <div class="g" style="background: var(--gradient-brand-soft); color:var(--indigo-700)">--gradient-brand-soft</div>
  </div>
</body>
</html>

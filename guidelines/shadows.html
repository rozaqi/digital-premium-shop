<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows & Elevation" subtitle="Soft, low-opacity, layered" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-page); font-family: var(--font-sans); padding: 30px 26px; }
  .row { display: flex; gap: 22px; flex-wrap: wrap; }
  .item { text-align: center; }
  .box { width: 96px; height: 64px; background: var(--surface-card); border-radius: 14px; border: 1px solid var(--border-subtle); }
  .k { font-size: 11px; font-family: var(--font-mono); color: var(--text-secondary); margin-top: 12px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="box-shadow:var(--shadow-xs)"></div><div class="k">xs</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="k">sm · card</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="k">md</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="k">lg · hover</div></div>
    <div class="item"><div class="box" style="box-shadow:var(--shadow-primary)"></div><div class="k">primary glow</div></div>
  </div>
</body>
</html>

<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale" subtitle="4px base grid" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 24px 26px; }
  .row { display: flex; align-items: center; gap: 12px; margin-bottom: 9px; }
  .bar { height: 16px; background: var(--gradient-brand); border-radius: 4px; }
  .k { font-size: 11px; font-family: var(--font-mono); color: var(--text-secondary); width: 92px; }
</style>
</head>
<body>
  <div class="row"><span class="k">space-1 · 4</span><span class="bar" style="width:4px"></span></div>
  <div class="row"><span class="k">space-2 · 8</span><span class="bar" style="width:8px"></span></div>
  <div class="row"><span class="k">space-4 · 16</span><span class="bar" style="width:16px"></span></div>
  <div class="row"><span class="k">space-6 · 24</span><span class="bar" style="width:24px"></span></div>
  <div class="row"><span class="k">space-10 · 40</span><span class="bar" style="width:40px"></span></div>
  <div class="row"><span class="k">space-16 · 64</span><span class="bar" style="width:64px"></span></div>
  <div class="row"><span class="k">space-24 · 96</span><span class="bar" style="width:96px"></span></div>
</body>
</html>

<!-- @dsCard group="Colors" viewport="700x190" name="Brand — Indigo & Accent" subtitle="Primary indigo, emerald accent, amber highlight" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 22px 24px; }
  .row { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .sw { width: 92px; }
  .chip { height: 56px; border-radius: 12px; border: 1px solid rgba(15,23,42,0.06); }
  .name { font-size: 11px; font-weight: 700; color: var(--text-primary); margin-top: 6px; }
  .hex { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); }
  .lead { display:flex; gap: 16px; margin-bottom: 18px; }
  .big { flex: 1; height: 64px; border-radius: 14px; display: flex; align-items: flex-end; padding: 10px 14px; color: #fff; font-weight: 700; font-size: 13px; }
</style>
</head>
<body>
  <div class="lead">
    <div class="big" style="background: var(--color-primary)">Primary · Indigo 600</div>
    <div class="big" style="background: var(--color-accent)">Accent · Emerald 500</div>
    <div class="big" style="background: var(--amber-500); color:#3b2c05">Highlight · Amber 500</div>
  </div>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--indigo-50)"></div><div class="name">indigo 50</div><div class="hex">#EEF0FF</div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-100)"></div><div class="name">indigo 100</div><div class="hex">#E0E3FF</div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-300)"></div><div class="name">indigo 300</div><div class="hex">#A5ABFB</div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-500)"></div><div class="name">indigo 500</div><div class="hex">#6366F1</div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-600)"></div><div class="name">indigo 600</div><div class="hex">#5046E5</div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-700)"></div><div class="name">indigo 700</div><div class="hex">#4338CA</div></div>
    <div class="sw"><div class="chip" style="background:var(--indigo-900)"></div><div class="name">indigo 900</div><div class="hex">#2C2A7A</div></div>
  </div>
</body>
</html>

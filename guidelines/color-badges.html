<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 26px 24px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
  .pill { display: inline-flex; align-items: center; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px; }
</style>
</head>
<body>
  <div class="row">
    <span class="pill" style="background:var(--badge-bestseller-bg); color:var(--badge-bestseller-fg)">Best Seller</span>
    <span class="pill" style="background:var(--badge-popular-bg); color:var(--badge-popular-fg)">Popular</span>
    <span class="pill" style="background:var(--badge-new-bg); color:var(--badge-new-fg)">New</span>
    <span class="pill" style="background:var(--rose-100); color:var(--rose-600)">-40% Sale</span>
    <span class="pill" style="background:var(--emerald-50); color:var(--emerald-700)">Garansi</span>
    <span class="pill" style="background:var(--slate-100); color:var(--slate-600)">Streaming</span>
  </div>
</body>
</html>

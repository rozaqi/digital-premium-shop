<!-- @dsCard group="Type" viewport="700x230" name="Display & Headings" subtitle="Plus Jakarta Sans, bold, tight tracking" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 24px 26px; color: var(--text-primary); }
  .spec { display: flex; align-items: baseline; gap: 16px; margin-bottom: 14px; }
  .meta { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); white-space: nowrap; width: 96px; flex-shrink: 0; }
  .d { font-size: var(--text-display); font-weight: 800; letter-spacing: var(--tracking-tighter); line-height: 1; }
  .h1 { font-size: var(--text-h1); font-weight: 800; letter-spacing: var(--tracking-tight); }
  .h2 { font-size: var(--text-h2); font-weight: 700; letter-spacing: var(--tracking-tight); }
  .h3 { font-size: var(--text-h3); font-weight: 700; }
</style>
</head>
<body>
  <div class="spec"><span class="meta">56 / 800</span><span class="d">Akun Premium</span></div>
  <div class="spec"><span class="meta">44 / 800</span><span class="h1">Lebih Hemat &amp; Cepat</span></div>
  <div class="spec"><span class="meta">34 / 700</span><span class="h2">Produk Populer</span></div>
  <div class="spec"><span class="meta">24 / 700</span><span class="h3">Netflix Premium</span></div>
</body>
</html>

<!-- @dsCard group="Type" viewport="700x140" name="Weights & Eyebrow" subtitle="400–800 + uppercase eyebrow label" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 24px 26px; color: var(--text-primary); }
  .row { display: flex; gap: 22px; align-items: baseline; margin-bottom: 16px; flex-wrap: wrap; }
  .w { font-size: 22px; }
  .t { font-size: 11px; color: var(--text-tertiary); font-family: var(--font-mono); display: block; }
  .eyebrow { font-size: var(--text-xs); font-weight: 700; letter-spacing: var(--tracking-eyebrow); text-transform: uppercase; color: var(--color-primary); }
</style>
</head>
<body>
  <div class="row">
    <span class="w" style="font-weight:400">Regular<span class="t">400</span></span>
    <span class="w" style="font-weight:500">Medium<span class="t">500</span></span>
    <span class="w" style="font-weight:600">Semibold<span class="t">600</span></span>
    <span class="w" style="font-weight:700">Bold<span class="t">700</span></span>
    <span class="w" style="font-weight:800">Extrabold<span class="t">800</span></span>
  </div>
  <div class="eyebrow">Produk Populer · Eyebrow 12 / 700 / 0.08em</div>
</body>
</html>

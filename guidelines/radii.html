<!-- @dsCard group="Spacing" viewport="700x160" name="Corner Radii" subtitle="6 → 32px, soft & friendly" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body { margin: 0; background: var(--surface-card); font-family: var(--font-sans); padding: 24px 26px; }
  .row { display: flex; gap: 18px; flex-wrap: wrap; }
  .item { text-align: center; }
  .box { width: 76px; height: 64px; background: var(--indigo-50); border: 1.5px solid var(--indigo-200); }
  .k { font-size: 11px; font-family: var(--font-mono); color: var(--text-secondary); margin-top: 7px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="box" style="border-radius:var(--radius-sm)"></div><div class="k">sm · 10</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-md)"></div><div class="k">md · 14</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="k">lg · 18</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="k">xl · 24</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="k">2xl · 32</div></div>
    <div class="item"><div class="box" style="border-radius:var(--radius-pill); width:64px"></div><div class="k">pill</div></div>
  </div>
</body>
</html>
